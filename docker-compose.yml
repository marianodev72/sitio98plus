services:
  api:
    build:
      context: ./backend
    container_name: sitio98_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - ALOJAMIENTOS_STORAGE_ROOT=/DATA/storage/sitio98plus/alojamientos/documentos/anexo-21
    expose:
      - "3000"
    volumes:
      - uploads:/app/uploads
      - uploads_private:/app/uploads_private
      - /DATA/storage/sitio98plus/alojamientos:/DATA/storage/sitio98plus/alojamientos
    networks:
      - app_net

  web:
    build:
      context: ./frontend
    container_name: sitio98_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - app_net

networks:
  app_net:

volumes:
  uploads:
  uploads_private:

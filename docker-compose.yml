services:
  api:
    build:
      context: ./backend
    container_name: sitio98_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - ALOJAMIENTOS_STORAGE_ROOT=/DATA/storage/sitio98plus/alojamientos/documentos/anexo-21
      - PADRON_PERSONAL_PATH=/app/secure-data/padron-personal/padron-personal-vigente.json
      - PADRON_PERSONAL_BACKUP_DIR=/app/secure-data/padron-personal/backups
      - PADRON_PERSONAL_STAGING_DIR=/app/secure-data/padron-personal/staging
      - PADRON_PERSONAL_KEEP_STAGING=false
    expose:
      - "3000"
    volumes:
      - uploads:/app/uploads
      - uploads_private:/app/uploads_private
      - /DATA/storage/sitio98plus/alojamientos:/DATA/storage/sitio98plus/alojamientos
      - /DATA/sitio98plus/secure/padron-personal:/app/secure-data/padron-personal
    networks:
      - app_net

  web:
    build:
      context: ./frontend
    container_name: sitio98_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - app_net

networks:
  app_net:

volumes:
  uploads:
  uploads_private:
